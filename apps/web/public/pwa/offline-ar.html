<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9b2d6a" />
    <title>بنك الحب — غير متصل</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1f3;
        --fg: #221a20;
        --brand: #6d1f4a;
        --muted: #6f646b;
        --surface: #fffafb;
        --border: #d9cdd4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--fg);
        background: radial-gradient(ellipse 80% 50% at 0% -10%, #f0d5e288, transparent), var(--bg);
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem
          max(1.5rem, env(safe-area-inset-bottom));
      }
      main {
        width: min(34rem, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.75rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        color: var(--brand);
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
      }
      .note {
        margin-top: 1rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>بنك الحب غير متصل بالإنترنت</h1>
      <p>
        لا يتم تخزين بيانات العلاقة الخاصة للوصول إليها دون اتصال. أعد الاتصال لتحميل معلوماتك أو
        تعديلها.
      </p>
      <p class="note">هذه مشكلة اتصال بالشبكة وليست تسجيل خروج. هذه الصفحة لا تُنهي جلستك.</p>
    </main>
  </body>
</html>
